name: Update stations

on:
  schedule:
    - cron: '0 3 * * 1'        # каждый понедельник, 03:00 UTC
  workflow_dispatch:            # кнопка "Run workflow" вручную
  push:
    paths:
      - 'manual.json'           # после правки manual.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch stations
        run: node update_stations.js
      - name: Commit if changed
        run: |
          git config user.name "stations-bot"
          git config user.email "stations-bot@users.noreply.github.com"
          git add stations.json
          git diff --cached --quiet || (git commit -m "Update stations" && git push)
